.tbl-wrap{overflow-x:auto}

.can-speak td[data-say]:hover{background:var(--chip)}

blar", "Ils peuvent parler", "il pöv parlé", "They can speak", "déi can spiik"]]}, {"tab": "Gustar / Necesitar / Ir", "title": "AIMER / AVOIR BESOIN DE / ALLER + infinitivo", "note": "El segundo verbo queda siempre en infinitivo, sin conjugar.", "rows": [["Me gusta comer", "J'aime manger", "yem manyé", "I like to eat", "ái laik tu iit"], ["Nos gusta hablar", "Nous aimons parler", "nuzemón parlé", "We like to speak", "uí laik tu spiik"], ["Necesito hablar", "J'ai besoin de parler", "yé besuán de parlé", "I need to speak", "ái niid tu spiik"], ["Él necesita ir", "Il a besoin d'aller", "il a besuán dalé", "He needs to go", "jí niids tu góu"], ["Voy a comer", "Je vais manger", "ye vé manyé", "I am going to eat", "ái am góin tu iit"], ["Vamos a hablar", "Nous allons parler", "nuzalón parlé", "We are going to speak", "uí ar góin tu spiik"]]}]}, {"name": "4 · Negación", "kind": "ph", "items": [{"tab": "Con los pilares", "title": "NÉGATION con los verbos pilares", "note": "Francés: ne + verbo + pas (n' ante vocal). En el habla informal se suele omitir «ne». Inglés: do/does + not; con to be no se usa do.", "rows": [["No soy", "Je ne suis pas", "ye ne suí pa", "I am not", "ái am not"], ["No tienes", "Tu n'as pas", "tu na pa", "You don't have", "iú dóunt jav"], ["Él no va", "Il ne va pas", "il ne va pa", "He doesn't go", "jí dázent góu"], ["No necesitamos", "Nous n'avons pas besoin de", "nu navón pa besuán de", "We don't need", "uí dóunt niid"], ["Ellos no son", "Ils ne sont pas", "il ne son pa", "They are not", "déi ar not"], ["No fui", "Je n'ai pas été", "ye né pa eté", "I was not", "ái uás not"]]}, {"tab": "Con otros verbos", "title": "NÉGATION con modales y regulares", "note": "Con can se usa can't (o cannot). En pasado, «pas» rodea al auxiliar: je n'ai pas parlé.", "rows": [["No puedo", "Je ne peux pas", "ye ne pö pa", "I can't", "ái cant"], ["No quiero hablar", "Je ne veux pas parler", "ye ne vö pa parlé", "I don't want to speak", "ái dóunt uánt tu spiik"], ["No hablamos", "Nous ne parlons pas", "nu ne parlón pa", "We don't speak", "uí dóunt spiik"], ["No le gusta esto", "Il n'aime pas ça", "il nem pa sa", "He doesn't like this", "jí dázent laik dis"], ["No vamos a ir", "Nous n'allons pas aller", "nu nalón pa alé", "We are not going to go", "uí ar not góin tu góu"]]}]}, {"name": "5 · Preguntas", "kind": "ph", "items": [{"tab": "Cómo preguntar", "title": "QUESTIONS", "note": "Francés: entonación (informal), est-ce que (neutro) o inversión (formal). Inglés: do/does + sujeto + verbo base; con be y can se invierte el orden.", "rows": [["¿Hablas inglés?", "Tu parles anglais ?", "tu parl anglé", "Do you speak English?", "du iú spiik inglish"], ["¿Necesitas ayuda?", "Est-ce que tu as besoin d'aide ?", "es ke tu a besuán ded", "Do you need help?", "du iú niid jelp"], ["¿Ella habla español?", "Est-ce qu'elle parle espagnol ?", "eskel parl español", "Does she speak Spanish?", "das shí spiik spanish"], ["¿Estás listo?", "Tu es prêt ?", "tu é pré", "Are you ready?", "ar iú redi"], ["¿Puedes ayudarme?", "Tu peux m'aider ?", "tu pö medé", "Can you help me?", "can iú jelp mi"], ["¿Quieres un café?", "Tu veux un café ?", "tu vö an café", "Do you want a coffee?", "du iú uánt a cofi"]]}, {"tab": "Palabras interrogativas", "title": "MOTS INTERROGATIFS / QUESTION WORDS", "note": "Van al inicio: Où est-ce que tu vas ? · Where do you go?", "rows": [["quién", "qui", "ki", "who", "ju"], ["qué", "quoi", "kuá", "what", "uát"], ["dónde", "où", "u", "where", "uér"], ["cuándo", "quand", "kan", "when", "uén"], ["por qué", "pourquoi", "purkuá", "why", "uái"], ["cómo", "comment", "komán", "how", "jáu"], ["cuánto", "combien", "konbián", "how much", "jáu mach"]]}]}, {"name": "6 · Frases útiles", "kind": "ph", "items": [{"tab": "Artículos", "title": "LE / LA / UN / UNE · THE / A", "note": "Francés: todo sustantivo es masculino o femenino; aprende cada palabra con su artículo.", "rows": [["el café", "le café", "le café", "the coffee", "de cofi"], ["la casa", "la maison", "la mesón", "the house", "de jaus"], ["un libro", "un livre", "an livr", "a book", "a buk"], ["una mesa", "une table", "ün tabl", "a table", "a teibol"], ["los amigos", "les amis", "lezamí", "the friends", "de frends"], ["una manzana", "une pomme", "ün pom", "an apple", "an apol"]]}, {"tab": "Hay y preposiciones", "title": "IL Y A · À, AVEC, POUR · THERE IS, AT, WITH, FOR", "note": "", "rows": [["Hay un café", "Il y a un café", "il i a an café", "There is a coffee shop", "der is a cofi shop"], ["Hay dos mesas", "Il y a deux tables", "il i a dö tabl", "There are two tables", "der ar tu teibols"], ["Voy a casa", "Je vais à la maison", "ye vé a la mesón", "I go home", "ái góu jóum"], ["Estoy en el trabajo", "Je suis au travail", "ye suí o travái", "I am at work", "ái am at uérk"], ["Hablo con ella", "Je parle avec elle", "ye parl avek el", "I speak with her", "ái spiik uid jer"], ["Es para ti", "C'est pour toi", "se pur tuá", "It is for you", "it is for iú"]]}]}, {"name": "7 · Más pasado", "kind": "ph", "items": [{"tab": "Participios comunes", "title": "PASSÉ COMPOSÉ / PAST SIMPLE · verbos frecuentes", "note": "Francés: avoir + participio (ir y venir usan être). Inglés: los irregulares se memorizan; los regulares llevan -ed.", "rows": [["Hablé", "J'ai parlé", "yé parlé", "I spoke", "ái spóuk"], ["Comí", "J'ai mangé", "yé manyé", "I ate", "ái eit"], ["Hice", "J'ai fait", "yé fé", "I made", "ái meid"], ["Dije", "J'ai dit", "yé dí", "I said", "ái sed"], ["Tomé", "J'ai pris", "yé prí", "I took", "ái tuk"], ["Vi", "J'ai vu", "yé vü", "I saw", "ái so"], ["Quise", "J'ai voulu", "yé vulü", "I wanted", "ái uánted"], ["Pude", "J'ai pu", "yé pü", "I could", "ái cud"], ["Vine", "Je suis venu", "ye suí venü", "I came", "ái keim"], ["Compré", "J'ai acheté", "yé ashté", "I bought", "ái bot"]]}, {"tab": "Ayer y mañana", "title": "Palabras de tiempo", "note": "", "rows": [["ayer", "hier", "ier", "yesterday", "iésterdei"], ["hoy", "aujourd'hui", "oyurdüi", "today", "tudéi"], ["mañana", "demain", "demán", "tomorrow", "tumórou"], ["Ayer fui al trabajo", "Hier, je suis allé au travail", "ier ye suí alé o travái", "Yesterday I went to work", "iésterdei ái uént tu uérk"], ["Mañana voy a comer con ella", "Demain, je vais manger avec elle", "demán ye vé manyé avek el", "Tomorrow I am going to eat with her", "tumórou ái am góin tu iit uid jer"]]}]}, {"name": "8 · Mini diálogos", "kind": "ph", "items": [{"tab": "En un café", "title": "DIALOGUE 1 · Au café / At the café", "note": "Practica en voz alta los dos papeles (A y B).", "rows": [["A: Hola, ¿puedo ayudarle?", "Bonjour, je peux vous aider ?", "bonyur ye pö vuzedé", "Hello, can I help you?", "jelóu can ái jelp iú"], ["B: Quiero un café, por favor", "Je veux un café, s'il vous plaît", "ye vö an café sil vu plé", "I want a coffee, please", "ái uánt a cofi plis"], ["A: ¿Algo más?", "Autre chose ?", "ótr shóz", "Anything else?", "enizing els"], ["B: No, es todo", "Non, c'est tout", "non se tu", "No, that's all", "nóu dats ol"], ["A: Son tres euros", "Ça fait trois euros", "sa fé truá ö ro", "That's three euros", "dats srii iúrous"], ["B: ¿Puedo pagar con tarjeta?", "Je peux payer par carte ?", "ye pö peyé par cart", "Can I pay by card?", "can ái pei bai card"]]}, {"tab": "Conociéndose", "title": "DIALOGUE 2 · Se présenter / Meeting someone", "note": "Practica en voz alta los dos papeles (A y B).", "rows": [["A: Hola, ¿cómo estás?", "Salut, ça va ?", "salü sa va", "Hi, how are you?", "jai jáu ar iú"], ["B: Estoy bien, ¿y tú?", "Je vais bien, et toi ?", "ye vé bián e tuá", "I am fine, and you?", "ái am fain and iú"], ["A: ¿Hablas español?", "Tu parles espagnol ?", "tu parl español", "Do you speak Spanish?", "du iú spiik spanish"], ["B: Sí, un poco", "Oui, un peu", "ui an pö", "Yes, a little", "ies a lital"], ["A: ¿Quieres un café?", "Tu veux un café ?", "tu vö an café", "Do you want a coffee?", "du iú uánt a cofi"], ["B: ¡Sí, vamos!", "Oui, on y va !", "ui on i va", "Yes, let's go!", "ies lets góu"]]}]}];
const LANG_LABELS = ["Français","English"];
const TENSE_LABELS = ["Presente","Pasado","Futuro"];
const CAN_SPEAK = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
if (CAN_SPEAK) document.body.classList.add('can-speak');
const LOCALES = ['fr-FR','en-US'];
function pickVoice(loc){
  const vs = speechSynthesis.getVoices(), pre = loc.slice(0,2);
  return vs.find(v=>v.lang.replace('_','-')===loc) || vs.find(v=>v.lang.toLowerCase().startsWith(pre)) || null;
}
// Solo para la voz: "Il / Elle est" -> "Il est" (el texto en pantalla no cambia)
function speakable(s){ return s.replace(/^(\S+) \/ \S+ /,'$1 '); }
const IN_APP = /FBAN|FBAV|Instagram|WhatsApp|Line\/|; wv\)/i.test(navigator.userAgent);
function notice(msg){ document.getElementById('noticeTxt').textContent = msg; document.getElementById('notice').classList.add('show'); }
document.getElementById('noticeX').onclick = ()=>document.getElementById('notice').classList.remove('show');
const OPEN_HINT = ' Si abriste esta página desde WhatsApp u otra app, ábrela en Safari o Chrome (menú ⋯ → «Abrir en el navegador»).';
if (!CAN_SPEAK) notice('Este navegador no permite reproducir audio de pronunciación.' + OPEN_HINT);
let lastCell = null;
function speak(td){
  speechSynthesis.cancel();
  if (lastCell) lastCell.classList.remove('speaking');
  const loc = LOCALES[st.l], u = new SpeechSynthesisUtterance(speakable(td.dataset.say));
  u.lang = loc; u.rate = 0.85;
  const v = pickVoice(loc); if (v) u.voice = v;
  td.classList.add('speaking'); lastCell = td;
  let started = false;
  u.onstart = ()=>{ started = true; };
  u.onend = ()=>td.classList.remove('speaking');
  u.onerror = ()=>{ td.classList.remove('speaking'); notice('No se pudo reproducir el audio.' + OPEN_HINT); };
  speechSynthesis.speak(u);
  setTimeout(()=>{ if (!started && !speechSynthesis.speaking) { td.classList.remove('speaking'); notice('No se escuchó nada: este dispositivo quizá no tiene voz en ' + (st.l===0?'francés':'inglés') + ' o el navegador bloquea el audio.' + OPEN_HINT); } }, 2000);
  if (!v && IN_APP) notice('Estás en el navegador de una app.' + OPEN_HINT);
}
if (CAN_SPEAK) speechSynthesis.onvoiceschanged = ()=>{};
let st = {m:0,l:0,t:0,v:0,p:false};
try { const s = JSON.parse(localStorage.getItem('verbos-state2')||'null'); if (s && MODS[s.m]) st = {m:s.m|0,l:s.l&1,t:s.t|0,v:s.v|0,p:!!s.p}; } catch(e){}

function seg(id, labels, cur, onPick){
  const box = document.getElementById(id); box.replaceChildren();
  labels.forEach((txt,i)=>{
    const b = document.createElement('button'); b.type='button'; b.textContent = txt;
    b.setAttribute('aria-pressed', i===cur); b.onclick = ()=>onPick(i); box.appendChild(b);
  });
}
function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }

function cell(c, cls){
  const td = el('td', cls);
  td.appendChild(el('span','verb-text',c[0])); td.appendChild(el('span','pronun',c[1]));
  td.onclick = ()=>{ td.classList.remove('veil'); if (CAN_SPEAK) speak(td); };
  if (CAN_SPEAK) { td.dataset.say = c[0]; td.tabIndex = 0; td.setAttribute('role','button'); td.setAttribute('aria-label','Escuchar: '+c[0]);
    td.onkeydown = e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); td.onclick(); } }; }
  return td;
}
function render(){
  if (CAN_SPEAK) speechSynthesis.cancel();
  const M = MODS[st.m], conj = M.kind==='conj', items = conj ? M.langs[st.l].tenses : M.items;
  if (st.t >= items.length) st.t = 0;
  const I = items[st.t];
  if (conj && st.v >= I.head.length) st.v = 0;
  try { localStorage.setItem('verbos-state2', JSON.stringify(st)); } catch(e){}
  document.documentElement.lang = st.l===0 ? 'fr' : 'en';
  const sel = document.getElementById('mod');
  if (!sel.options.length) { MODS.forEach((m,i)=>sel.add(new Option(m.name,i))); sel.onchange = ()=>{ st.m=+sel.value; st.t=0; st.v=0; render(); }; }
  sel.value = st.m;
  seg('lang', LANG_LABELS, st.l, i=>{st.l=i; render();});
  seg('tense', items.map(x=>x.tab), st.t, i=>{st.t=i; render();});
  document.getElementById('tense').classList.toggle('off', items.length<2);
  seg('verbs', conj?I.head:[], st.v, i=>{st.v=i; render();});
  document.getElementById('verbs').classList.toggle('off', !conj);
  const pb = document.getElementById('prac'); pb.hidden = conj;
  pb.textContent = 'Modo práctica: ' + (st.p?'sí':'no'); pb.setAttribute('aria-pressed', st.p); pb.onclick = ()=>{st.p=!st.p; render();};
  document.getElementById('ttl').textContent = I.title;
  const nt = document.getElementById('note'); nt.textContent = I.note||''; nt.hidden = !I.note;
  const thead = document.getElementById('thead'), tb = document.getElementById('tbody'); thead.replaceChildren(); tb.replaceChildren();
  const hr = el('tr');
  if (conj) {
    hr.appendChild(el('th',null,'Pron.'));
    I.head.forEach((h,i)=>hr.appendChild(el('th','col'+(i===st.v?' on':''),h)));
    I.rows.forEach(r=>{
      const tr = el('tr'); const td0 = el('td'); td0.appendChild(el('b',null,r.pron)); tr.appendChild(td0);
      r.cells.forEach((c,i)=>tr.appendChild(cell(c,'col'+(i===st.v?' on':''))));
      tb.appendChild(tr);
    });
  } else {
    hr.appendChild(el('th',null,'Español')); hr.appendChild(el('th',null,LANG_LABELS[st.l]));
    I.rows.forEach(r=>{
      const tr = el('tr'); tr.appendChild(el('td',null,r[0]));
      tr.appendChild(cell(st.l ? [r[3],r[4]] : [r[1],r[2]], st.p ? 'veil' : ''));
      tb.appendChild(tr);
    });
  }
  thead.appendChild(hr);
}
render();
if ('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')) {
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
